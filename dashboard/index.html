<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Container Dashboard</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --fg:#e6e9ee; --dim:#8b94a3; --up:#3ccf7a; --down:#ef5b5b; --wait:#e0b44c; --accent:#5aa2ff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 6px 12px; color: var(--dim); }
  .svc { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; background: none; color: inherit; font: inherit; text-align: left; }
  .svc:hover { background: #1e232b; }
  .svc.on { border-color: var(--accent); background: #1b2230; }
  .svc:focus-visible, .pbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--wait); flex: none; }
  .dot.up { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .dot.down { background: var(--down); }
  .name { font-weight: 600; }
  .port { color: var(--dim); font-size: 12px; font-family: Consolas, monospace; }
  .foot { margin-top: auto; color: var(--dim); font-size: 12px; padding: 6px; }

  /* Layout: Paint across the top, Whiteboard bottom-left, Console bottom-right */
  /* Sizes come from --top (Paint height) and --left (Whiteboard width), set by dragging the splitters */
  .grid { --top: 50%; --left: 50%; display: grid; padding: 8px; height: 100%; min-width: 0;
          grid-template-columns: minmax(160px, var(--left)) 8px minmax(160px, 1fr);
          grid-template-rows: minmax(120px, var(--top)) 8px minmax(120px, 1fr);
          grid-template-areas: "paint paint paint" "hs hs hs" "whiteboard vs console"; }
  .split { position: relative; z-index: 2; background: transparent; touch-action: none; outline: none; }
  .split::after { content: ""; position: absolute; border-radius: 2px; background: var(--line); transition: background .15s; }
  .split:hover::after, .split.drag::after, .split:focus-visible::after { background: var(--accent); }
  .split-h { grid-area: hs; cursor: row-resize; }
  .split-h::after { left: 50%; top: 2px; width: 48px; height: 4px; margin-left: -24px; }
  .split-v { grid-area: vs; cursor: col-resize; }
  .split-v::after { top: 50%; left: 2px; width: 4px; height: 48px; margin-top: -24px; }
  .split.drag::after { left: 0; right: 0; top: 0; bottom: 0; width: auto; height: auto; margin: 0; opacity: .6; }
  /* while dragging, iframes must not swallow the mouse */
  .grid.resizing iframe { pointer-events: none; }
  .grid.resizing { user-select: none; }
  .pane { grid-area: var(--area); display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .pane[data-id="paint"] { --area: paint; }
  .pane[data-id="whiteboard"] { --area: whiteboard; }
  .pane[data-id="console"] { --area: console; }
  .pane { container-type: inline-size; }
  .phead { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
  .phead b { margin-right: auto; }
  @container (max-width: 460px) { .phead .port { display: none; } .pbtn { padding: 3px 5px; } }
  @container (max-width: 340px) { .pbtn[data-reload] { display: none; } }
  .phead b { font-size: 14px; }
  .phead .port { margin-right: auto; }
  .pbtn { background: none; border: 1px solid transparent; color: var(--dim); border-radius: 5px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12px; text-decoration: none; }
  .pbtn:hover { color: var(--fg); border-color: var(--line); background: #1e232b; }
  .pane iframe { flex: 1; width: 100%; border: 0; background: #fff; min-height: 0; }
  .pane[data-id="console"] iframe { background: #2b2b2b; }

  /* Focus one pane: it fills the whole area, the others hide (iframes stay loaded) */
  .grid.focus { grid-template-columns: 1fr; grid-template-rows: 1fr; grid-template-areas: "main"; }
  .grid.focus .pane, .grid.focus .split { display: none; }
  .grid.focus .pane.focused { display: flex; grid-area: main; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { flex-direction: row; flex-wrap: wrap; } h1, .foot { display: none; }
    .grid { gap: 8px; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; grid-template-areas: "paint" "whiteboard" "console"; }
    .split { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>4 containers</h1>
    <button class="svc on" data-id="dashboard"><span class="dot" id="d-dashboard"></span><span class="name">Dashboard</span></button>
    <button class="svc" data-id="paint"><span class="dot" id="d-paint"></span><span class="name">Paint</span></button>
    <button class="svc" data-id="whiteboard"><span class="dot" id="d-whiteboard"></span><span class="name">Whiteboard</span></button>
    <button class="svc" data-id="console"><span class="dot" id="d-console"></span><span class="name">Console</span></button>
    <div class="foot" id="foot">Checking services…</div>
  </aside>
  <main class="grid" id="grid"></main>
</div>
<script>
const SVC = {
  paint:      { title: "Paint",      port: 8081 },
  whiteboard: { title: "Whiteboard", port: 8083 },
  console:    { title: "Console",    port: 8082 },
};
const url = id => `${location.protocol}//${location.hostname}:${SVC[id].port}/`;
const grid = document.getElementById("grid");

// Build the three panes once, so the apps keep their state while the status refreshes.
grid.innerHTML = Object.entries(SVC).map(([id, s]) => `
  <section class="pane" data-id="${id}">
    <div class="phead"><span class="dot" id="p-${id}"></span><b>${s.title}</b>
      <button class="pbtn" data-max="${id}" title="Show only ${s.title}">Maximize</button>
      <button class="pbtn" data-reload="${id}" title="Reload ${s.title}">Reload</button>
      <a class="pbtn" href="${url(id)}" target="_blank" rel="noopener" title="Open ${s.title} in a new tab">New tab ↗</a></div>
    <iframe src="${url(id)}" title="${s.title}"></iframe>
  </section>`).join("") +
  `<div class="split split-h" role="separator" aria-orientation="horizontal" aria-label="Resize Paint height" tabindex="0" title="Drag to resize · double-click to reset"></div>
   <div class="split split-v" role="separator" aria-orientation="vertical" aria-label="Resize Whiteboard and Console width" tabindex="0" title="Drag to resize · double-click to reset"></div>`;

/* ---------- resizable panes ---------- */
const SIZE_KEY = "dashboard.sizes";
const sizes = (() => { try { return Object.assign({ top: 50, left: 50 }, JSON.parse(localStorage.getItem(SIZE_KEY) || "{}")); } catch { return { top: 50, left: 50 }; } })();
function applySizes() {
  grid.style.setProperty("--top", sizes.top + "%");
  grid.style.setProperty("--left", sizes.left + "%");
  document.querySelector(".split-h").setAttribute("aria-valuenow", Math.round(sizes.top));
  document.querySelector(".split-v").setAttribute("aria-valuenow", Math.round(sizes.left));
  try { localStorage.setItem(SIZE_KEY, JSON.stringify(sizes)); } catch {}
}
function setSize(key, pct) { sizes[key] = Math.min(85, Math.max(15, pct)); applySizes(); }
function makeSplitter(el, key, horizontal) {
  el.addEventListener("pointerdown", e => {
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    el.classList.add("drag"); grid.classList.add("resizing");
    // grid track percentages are relative to the grid's content box (inside the 8px padding);
    // subtract half the 8px splitter so its centre lands exactly under the pointer
    const r = grid.getBoundingClientRect(), pad = 8, half = 4;
    const move = ev => {
      const pct = horizontal ? (ev.clientY - r.top - pad - half) / (r.height - pad * 2) * 100
                             : (ev.clientX - r.left - pad - half) / (r.width - pad * 2) * 100;
      setSize(key, pct);
    };
    const up = () => { el.classList.remove("drag"); grid.classList.remove("resizing"); el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  el.addEventListener("dblclick", () => setSize(key, 50));
  el.addEventListener("keydown", e => {
    const step = e.shiftKey ? 10 : 2;
    const dec = horizontal ? "ArrowUp" : "ArrowLeft", inc = horizontal ? "ArrowDown" : "ArrowRight";
    if (e.key === dec) { setSize(key, sizes[key] - step); e.preventDefault(); }
    if (e.key === inc) { setSize(key, sizes[key] + step); e.preventDefault(); }
    if (e.key === "Home" || e.key === "Enter") { setSize(key, 50); e.preventDefault(); }
  });
}
makeSplitter(document.querySelector(".split-h"), "top", true);
makeSplitter(document.querySelector(".split-v"), "left", false);
applySizes();

function select(id) {
  document.querySelectorAll(".svc").forEach(b => b.classList.toggle("on", b.dataset.id === id));
  const focus = id !== "dashboard";
  grid.classList.toggle("focus", focus);
  grid.querySelectorAll(".pane").forEach(p => p.classList.toggle("focused", p.dataset.id === id));
  grid.querySelectorAll("[data-max]").forEach(b => b.textContent = focus ? "Back to grid" : "Maximize");
}
document.querySelectorAll(".svc").forEach(b => b.onclick = () => select(b.dataset.id));
grid.addEventListener("click", e => {
  const m = e.target.closest("[data-max]"); if (m) select(grid.classList.contains("focus") ? "dashboard" : m.dataset.max);
  const r = e.target.closest("[data-reload]"); if (r) { const f = grid.querySelector(`.pane[data-id="${r.dataset.reload}"] iframe`); f.src = url(r.dataset.reload); }
});

/* ---------- relay: whiteboard ink -> paint ---------- */
const originOf = id => `${location.protocol}//${location.hostname}:${SVC[id].port}`;
const frame = id => grid.querySelector(`.pane[data-id="${id}"] iframe`);
let lastInk = null;
addEventListener("message", e => {
  const d = e.data || {};
  if (e.origin === originOf("whiteboard") && d.type === "wb-live" && d.bmp) {
    frame("paint").contentWindow.postMessage(d, originOf("paint"), [d.bmp]);
  } else if (e.origin === originOf("whiteboard") && d.type === "wb-ink") {
    lastInk = d;
    frame("paint").contentWindow.postMessage(d, originOf("paint"));
  } else if (e.origin === originOf("paint") && d.type === "paint-ready") {
    if (lastInk) frame("paint").contentWindow.postMessage(lastInk, originOf("paint"));
    else frame("whiteboard").contentWindow.postMessage({ type: "wb-request" }, originOf("whiteboard"));
  }
});

async function poll() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    const status = await r.json();
    for (const [id, st] of Object.entries(status)) {
      const cls = "dot " + (st.up ? "up" : "down");
      const d = document.getElementById("d-" + id); if (d) d.className = cls;
      const p = document.getElementById("p-" + id); if (p) { p.className = cls; p.title = st.up ? `up · ${st.ms} ms` : `down · ${st.error || st.code}`; }
    }
    const up = Object.values(status).filter(s => s.up).length;
    document.getElementById("foot").textContent = `${up} of 4 running · ${new Date().toLocaleTimeString()}`;
  } catch {
    document.getElementById("foot").textContent = "Dashboard API unreachable";
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
