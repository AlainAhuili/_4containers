# CI/CD for the four-container workspace
#
#   every push / pull request:  checks  ->  build + smoke test the whole stack
#   push to main:                ... ->  publish the 4 images to GitHub Container Registry (tags: latest, main, sha-<commit>)
#   push a tag v1.2.3:           ... ->  publish images tagged 1.2.3 and 1.2  ->  GitHub Release
#
# Use a published version on any machine with Docker:
#   TAG=1.2.3 docker compose pull && TAG=1.2.3 docker compose up -d --no-build
name: CI/CD

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/alainahuili

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Python compiles
        run: python3 -m py_compile dashboard/server.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript parses (inline <script> blocks and .js files)
        run: node ci/check-html-scripts.mjs dashboard/index.html whiteboard/index.html paint/wb-sync.js paint/no-tools.js

      - name: Shell scripts (shellcheck)
        run: shellcheck --severity=warning console/motd.sh ci/smoke-test.sh

      - name: Dockerfiles (hadolint, errors only)
        run: |
          for f in */Dockerfile; do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --failure-threshold error - < "$f"
          done

  smoke:
    name: Build and smoke test
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Smoke test
        run: bash ci/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.service }} image
    needs: smoke
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [dashboard, paint, console, whiteboard]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/four-containers-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=four-containers-${{ matrix.service }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release with the compose files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          tag="${VERSION#v}"
          cat > notes.md <<EOF
          Images for this release are on GitHub Container Registry, tagged \`${tag}\`:

          - \`${REGISTRY}/four-containers-dashboard:${tag}\`
          - \`${REGISTRY}/four-containers-paint:${tag}\`
          - \`${REGISTRY}/four-containers-console:${tag}\`
          - \`${REGISTRY}/four-containers-whiteboard:${tag}\`

          Run it: download \`compose.yaml\` and \`.env.example\` (save it as \`.env\`), then
          \`\`\`
          TAG=${tag} docker compose pull
          TAG=${tag} docker compose up -d --no-build
          \`\`\`
          EOF
          cp .env.example env.example
          gh release create "$VERSION" compose.yaml env.example --title "$VERSION" --notes-file notes.md --generate-notes
