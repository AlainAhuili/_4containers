# Four containers: a dashboard that watches and embeds the other three.
# All ports are bound to 127.0.0.1, so only this computer can reach them
# (the console is a real shell, so it should not be exposed to the network).
name: four-containers

# Images: built locally from ./<service> (docker compose up -d --build), or pulled from
# GitHub Container Registry, where CI/CD publishes them (docker compose pull; docker compose up -d --no-build).
# TAG picks the version: latest, main, sha-<commit>, or a release like 1.2.0.

services:
  dashboard:
    build: ./dashboard
    image: ${REGISTRY:-ghcr.io/alainahuili}/four-containers-dashboard:${TAG:-latest}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # internal addresses the dashboard probes (compose network DNS)
      PAINT_URL: http://paint:80/
      CONSOLE_URL: http://console:7681/
      WHITEBOARD_URL: http://whiteboard:80/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      paint:
        condition: service_healthy
      console:
        condition: service_healthy
      whiteboard:
        condition: service_healthy
    restart: unless-stopped

  paint:
    build: ./paint
    image: ${REGISTRY:-ghcr.io/alainahuili}/four-containers-paint:${TAG:-latest}
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  console:
    build: ./console
    image: ${REGISTRY:-ghcr.io/alainahuili}/four-containers-console:${TAG:-latest}
    hostname: ubuntu
    ports:
      - "127.0.0.1:8082:7681"
    volumes:
      - ubuntu-home:/home/dev
      # the host workspace folder (set WORKSPACE_DIR in .env), read-write at ~/workspace
      - ${WORKSPACE_DIR:-.}:/home/dev/workspace
    extra_hosts:
      # reach services running on this computer (the host's localhost) as host.docker.internal
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7681/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  whiteboard:
    build: ./whiteboard
    image: ${REGISTRY:-ghcr.io/alainahuili}/four-containers-whiteboard:${TAG:-latest}
    ports:
      - "127.0.0.1:8083:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  ubuntu-home:
